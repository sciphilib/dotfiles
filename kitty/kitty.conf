# Appearance
include rexim.conf
font_family Iosevka
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
window_padding_width 8

# Borderless macOS window, without titlebar or traffic-light buttons.
hide_window_decorations yes

# Option remains Alt/Meta; window commands use Control+x.
macos_option_as_alt yes

# Command+b/f sends Emacs Meta+b/f for word navigation (including note).
map cmd+b send_text all \x1bb
map cmd+f send_text all \x1bf

# Separate macOS window (Dock clicks only activate the running app).
map cmd+n new_os_window_with_cwd

# Splits and tabs
enabled_layouts splits,stack
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down
map cmd+shift+enter toggle_layout stack
map cmd+t new_tab_with_cwd

# Emacs-like window commands: Ctrl+x, release, then the next key.
# Ctrl+c is untouched. Ctrl+x Ctrl+x sends a literal Ctrl+x to applications.
map ctrl+x>2 combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+x>3 combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+x>0 close_window
map ctrl+x>1 close_other_windows_in_tab
map ctrl+x>o next_window
map ctrl+x>shift+o previous_window
map ctrl+x>ctrl+x send_text all \x18
map ctrl+x>ctrl+g no_op
map ctrl+x>escape no_op

# Reload settings
map cmd+shift+r load_config_file

# Quit the kitty process when its last window is closed (no empty instances)
macos_quit_when_last_window_closed yes
